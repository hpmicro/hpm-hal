[package]
name = "hpm5e00evk"
version = "0.1.0"
edition = "2024"
resolver = "2"

[dependencies]
hpm-hal = { path = "../..", features = [
    "hpm5e31",
    "rt",
    "embassy",
    "time-driver-gptmr0",
] }

panic-halt = "1.0.0"

defmt = "1.0.1"
defmt-rtt = "1.1.0"
embedded-hal = "1.0.0"
riscv = { version = "0.16.1", features = ["critical-section-single-hart"] }

embassy-time = { version = "0.5.1", features = ["tick-hz-1_000_000"] }
embassy-executor = { version = "0.10.0", features = [
    "nightly",
    "platform-riscv32",
    "executor-thread",
] }

[profile.release]
strip = false
lto = true
opt-level = "z"
debug = 2
